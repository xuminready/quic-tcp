[package]
name = "quic-tcp"
version = "0.1.0"
authors = ["Min Xu"]
license = "BSD-2-Clause"
repository = "https://github.com/xuminready/quic-tcp"
edition = "2024"

[dependencies]
env_logger = "0.11.11"
log = { version = "0.4.34", features = ["max_level_trace", "release_max_level_warn"] }
mio = { version = "1.2.2", features = ["net", "os-poll"] }
quiche = "0.29.3"
ring = "0.17.14"
socket2 = "0.6.5"

[[bin]]
name = "tcp-to-quic"
path = "src/bin/tcp_to_quic.rs"

[[bin]]
name = "quic-to-tcp"
path = "src/bin/quic_to_tcp.rs"

[[bin]]
name = "rendezvous-server"
path = "src/bin/rendezvous_server.rs"
